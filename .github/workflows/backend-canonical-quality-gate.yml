name: ILP Backend Canonical Quality Gate

run-name: Quality Gate - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - main
      - feature/scientific-feature-store
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-quality-gate:
    name: Canonical Gradle Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Run canonical backend quality pipeline
        run: |
          ./gradlew clean \
            build \
            test \
            jacocoTestReport \
            jacocoTestCoverageVerification \
            checkstyleMain \
            checkstyleTest \
            pmdMain \
            spotbugsMain \
            bootJar \
            --no-daemon \
            --no-configuration-cache

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-quality-reports-${{ github.run_number }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            bdd-tests/target/site/serenity/**
          if-no-files-found: warn
          retention-days: 14
