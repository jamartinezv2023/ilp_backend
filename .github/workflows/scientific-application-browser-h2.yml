name: Scientific application browser H2
on:
  pull_request:
    branches: [main]
    paths: ['adaptive-education-service/**', '.github/workflows/scientific-application-browser-h2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: jamartinezv2023/ilp_frontend
          ref: 046a4a64e1cbc112330532f9d28a957f7305758e
          path: frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend
      - run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --jsx react-jsx --strict --skipLibCheck --types vite/client e2e/scientific-application/harness.tsx
        working-directory: frontend
      - run: node --test e2e/scientific-application/payload.test.mjs
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: chmod +x gradlew
        working-directory: backend
      - run: ./gradlew :adaptive-education-service:test --tests '*SubmissionTimingValidatorTest' --tests '*ScientificApplicationBrowserBridgeTest' :adaptive-education-service:checkstyleMain :adaptive-education-service:checkstyleTest :adaptive-education-service:pmdMain :adaptive-education-service:pmdTest --no-daemon
        working-directory: backend
      - run: node e2e/scientific-application/run.mjs ../backend
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-application-evidence
          path: |
            frontend/test-results
            backend/adaptive-education-service/build/test-results/test
            backend/adaptive-education-service/build/reports
