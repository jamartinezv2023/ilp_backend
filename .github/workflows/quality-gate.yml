name: ILP Backend Quality Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  quality:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build + Test + Coverage
        run: |
          ./gradlew clean \
          build \
          test \
          jacocoTestReport \
          --no-daemon \
          -x :adaptive-education-service:test

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/build/reports/jacoco/**

      - name: Run PIT Mutation Testing
        run: |
          ./gradlew :common-events:pitest --no-daemon

      - name: Upload PIT reports
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: |
            common-events/build/reports/pitest/**
