name: ILP Backend Canonical Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "hotfix/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:

  canonical-quality-gate:

    name: Canonical Release Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Verify Gradle environment
        run: |
          java -version
          ./gradlew --version

      - name: Run canonical release quality pipeline
        run: |
          ./gradlew \
            clean \
            build \
            test \
            jacocoTestReport \
            jacocoTestCoverageVerification \
            checkstyleMain \
            checkstyleTest \
            pmdMain \
            spotbugsMain \
            bootJar \
            --console=plain \
            --no-daemon \
            --no-configuration-cache

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/build/reports/jacoco/**
          if-no-files-found: ignore

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: |
            **/build/reports/checkstyle/**
          if-no-files-found: ignore

      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: |
            **/build/reports/pmd/**
          if-no-files-found: ignore

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: |
            **/build/reports/spotbugs/**
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore