name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - feat/mvp-001-educational-diagnosis

  pull_request:
    branches:
      - main

jobs:
  build:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build, test and generate JaCoCo reports
        run: |
          ./gradlew \
            clean \
            test \
            jacocoTestReport \
            build \
            -x :bdd-tests:test \
            --no-daemon \
            --no-configuration-cache

      - name: Verify JaCoCo reports
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated JaCoCo XML reports:"
          find . \
            -path "*/build/reports/jacoco/test/jacocoTestReport.xml" \
            -type f \
            -print

          test -f \
            adaptive-education-service/build/reports/jacoco/test/jacocoTestReport.xml

          test -f \
            auth-service/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Set up JDK 21 for SonarCloud
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java for SonarCloud
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew --version

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            --no-daemon \
            --no-configuration-cache
