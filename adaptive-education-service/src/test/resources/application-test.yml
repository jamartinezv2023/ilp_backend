spring:
  datasource:
    url: jdbc:h2:mem:adaptive_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always
      continue-on-error: false
      data-locations: classpath:data.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info
