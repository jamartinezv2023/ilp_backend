trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - adaptive-education-service/*
      - commons-service/*
      - azure-pipelines.yml
      - infra/terraform/aks/*
      - k8s/*

variables:
  vmImage: 'ubuntu-latest'
  javaVersion: '17'
  dockerImageName: 'adaptive-education-service'
  dockerImageTag: '$(Build.BuildId)'
  terraformWorkingDirectory: 'infra/terraform/aks'

stages:
  - stage: Build
    displayName: 'Canonical Backend Quality Gate'
    jobs:
      - job: Canonical_Quality_Job
        displayName: 'Gradle Build, Test and Quality Gate'
        pool:
          vmImage: $(vmImage)

        steps:
          - checkout: self
            displayName: 'Checkout repository'
            fetchDepth: 0

          - task: JavaToolInstaller@0
            displayName: 'Install Java $(javaVersion)'
            inputs:
              versionSpec: '$(javaVersion)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: |
              chmod +x ./gradlew
              java -version
              ./gradlew --version
            displayName: 'Verify Java and Gradle Wrapper'

          - script: |
              ./gradlew \
                clean \
                build \
                test \
                jacocoTestReport \
                jacocoTestCoverageVerification \
                checkstyleMain \
                checkstyleTest \
                pmdMain \
                spotbugsMain \
                bootJar \
                --console=plain \
                --no-daemon \
                --no-configuration-cache
            displayName: 'Run Canonical Release Quality Pipeline'

          - task: PublishTestResults@2
            displayName: 'Publish JUnit test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/build/test-results/**/*.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: 'ILP Backend Gradle Tests'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish quality reports'
            condition: always()
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)'
              ArtifactName: 'ilp-backend-quality-evidence'
              publishLocation: 'Container'
  - stage: Infra
    displayName: 'Provisionar Infraestructura (Terraform AKS + ACR + Postgres)'
    dependsOn: Build
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          eq(variables['Build.SourceBranch'], 'refs/heads/master')
        )
      )
    jobs:
      - job: Infra_Job
        displayName: 'Terraform plan & apply'
        pool:
          vmImage: $(vmImage)
        steps:
          - task: TerraformInstaller@1
            displayName: 'Instalar Terraform'
            inputs:
              terraformVersion: '1.7.0'

          - script: |
              cd $(terraformWorkingDirectory)
              terraform init
            displayName: 'Terraform init'

          - script: |
              cd $(terraformWorkingDirectory)
              terraform plan -out=tfplan
            displayName: 'Terraform plan'

          - script: |
              cd $(terraformWorkingDirectory)
              terraform apply -auto-approve tfplan
            displayName: 'Terraform apply'

  - stage: DockerBuildAndPush
    displayName: 'Build & Push Docker Image'
    dependsOn: Infra
    condition: succeeded()
    jobs:
      - job: Docker_Job
        displayName: 'Build & Push Docker Image to ACR'
        pool:
          vmImage: $(vmImage)
        steps:
          - task: AzureCLI@2
            displayName: 'Login to ACR'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr login --name $(acrName)

          - task: Docker@2
            displayName: 'Build and Push adaptive-education-service image'
            inputs:
              containerRegistry: '$(ACR_SERVICE_CONNECTION)'
              repository: '$(dockerImageName)'
              command: 'buildAndPush'
              Dockerfile: 'adaptive-education-service/Dockerfile'
              buildContext: '$(System.DefaultWorkingDirectory)'
              tags: |
                $(dockerImageTag)

  - stage: Deploy
    displayName: 'Desplegar en AKS'
    dependsOn: DockerBuildAndPush
    condition: succeeded()
    jobs:
      - job: Deploy_Job
        displayName: 'kubectl apply en AKS'
        pool:
          vmImage: $(vmImage)
        steps:
          - task: AzureCLI@2
            displayName: 'Configurar kubectl (AKS)'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az aks get-credentials -g $(resourceGroup) -n $(aksClusterName) --overwrite-existing

          - task: Kubernetes@1
            displayName: 'kubectl apply -f k8s/'
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: '$(AZURE_SERVICE_CONNECTION)'
              azureResourceGroup: '$(resourceGroup)'
              kubernetesCluster: '$(aksClusterName)'
              command: 'apply'
              useConfigurationFile: true
              configuration: 'k8s/*.yml'
              secretType: 'dockerRegistry'
              containerRegistryType: 'Azure Container Registry'
              dockerRegistryEndpoint: '$(ACR_SERVICE_CONNECTION)'
